<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoE-Wiki Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            background: white; border-radius: 12px; padding: 40px; margin-bottom: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 30px;
        }
        .logo svg { width: 100px; height: auto; }
        header h1 { font-size: 32px; color: #1a202c; margin-bottom: 10px; }
        header p { color: #718096; font-size: 16px; line-height: 1.6; }

        .error-banner {
            display: none; background: #fee2e2; color: #7f1d1d; border-radius: 12px;
            padding: 20px; margin-bottom: 30px; font-size: 14px;
        }

        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center;
        }
        .stat-card .number {
            font-size: 32px; font-weight: bold; color: #3b82f6; margin-bottom: 10px;
        }
        .stat-card .label {
            color: #718096; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
        }

        .controls {
            background: white; border-radius: 12px; padding: 20px; margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 20px;
            flex-wrap: wrap; align-items: center;
        }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input {
            width: 100%; padding: 10px 15px; border: 2px solid #e2e8f0;
            border-radius: 6px; font-size: 14px;
        }
        .search-box input:focus { outline: none; border-color: #3b82f6; }

        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            padding: 8px 16px; border: 2px solid #e2e8f0; background: white;
            border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
        }
        button:hover { border-color: #3b82f6; color: #3b82f6; }
        button.active { background: #3b82f6; color: white; border-color: #3b82f6; }

        .page-item {
            padding: 15px; background: #f7fafc; border-radius: 8px; border-left: 4px solid #3b82f6;
            cursor: pointer; transition: all 0.2s;
        }
        .page-item:hover { background: #edf2f7; transform: translateX(5px); }
        .page-item.hidden { display: none; }
        .page-title { font-weight: 600; color: #1a202c; margin-bottom: 5px; }
        .page-meta {
            font-size: 12px; color: #718096; display: flex; gap: 15px; flex-wrap: wrap;
        }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 500; font-size: 11px;
        }
        .badge-source { background: #dbeafe; color: #0c4a6e; }
        .badge-concept { background: #dcfce7; color: #166534; }
        .badge-thesis { background: #fce7f3; color: #831843; }
        .badge-person { background: #fef3c7; color: #78350f; }
        .badge-intern { background: #fee2e2; color: #7f1d1d; }
        .badge-extern { background: #d1fae5; color: #065f46; }

        .section {
            background: white; border-radius: 12px; padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px;
        }
        .section h2 {
            font-size: 20px; color: #1a202c; margin-bottom: 20px;
            padding-bottom: 15px; border-bottom: 3px solid #e2e8f0;
        }
        .pages { display: flex; flex-direction: column; gap: 15px; }
        .empty {
            color: #a0aec0; font-style: italic; padding: 20px; text-align: center;
        }

        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); overflow-y: auto; padding: 20px;
        }
        .modal.active {
            display: flex; align-items: flex-start; justify-content: center; padding-top: 40px;
        }
        .modal-content {
            background-color: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 100%; max-width: 900px; max-height: 85vh; overflow-y: auto;
        }
        .modal-header {
            padding: 30px; border-bottom: 2px solid #e2e8f0; display: flex;
            justify-content: space-between; align-items: flex-start; position: sticky; top: 0;
            background: white; z-index: 10;
        }
        .modal-header h2 { margin: 0; font-size: 24px; color: #1a202c; flex: 1; }
        .modal-meta { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
        .modal-close {
            background: none; border: none; font-size: 28px; color: #718096; cursor: pointer;
            padding: 0; width: 40px; height: 40px; display: flex; align-items: center;
            justify-content: center; border-radius: 6px; flex-shrink: 0;
        }
        .modal-close:hover { background: #f7fafc; color: #1a202c; }
        .modal-body { padding: 30px; line-height: 1.8; color: #2d3748; }
        .modal-body h1, .modal-body h2, .modal-body h3 { margin: 20px 0 10px 0; color: #2d3748; }
        .modal-body ul, .modal-body ol { margin: 15px 0; padding-left: 25px; }
        .modal-body li { margin: 8px 0; }
        .modal-body a.wikilink {
            color: #3b82f6; text-decoration: underline; cursor: pointer;
        }
        .modal-body span.wikilink-broken {
            color: #b91c1c; border-bottom: 1px dashed #b91c1c; cursor: help;
        }
        footer { text-align: center; color: #718096; margin-top: 40px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570.3 373">
                    <path fill="#3b82f6" d="M353.4,126.9V16.2H127.2v0C66.7,16.9,17.8,66.2,17.8,126.9h109.4h111.9H353.4z"/>
                    <path fill="#3b82f6" d="M353.4,249.9H243.9H132.1H17.8v110.7h226.1v0C304.5,359.8,353.4,310.6,353.4,249.9"/>
                    <path fill="#3b82f6" d="M353.4,244.3c0-61.1-49.5-110.7-110.7-110.7c-1.2,0-224.9,0-224.9,0c0,61.1,49.5,110.7,110.7,110.7C129.7,244.3,353.4,244.3,353.4,244.3z"/>
                    <polygon fill="#3b82f6" points="408.3,16.2 561.8,169.8 561.8,16.2"/>
                    <polygon fill="#3b82f6" points="561.8,360.5 409.3,208 561.8,208"/>
                </svg>
            </div>
            <div>
                <h1>FoE-Wiki</h1>
                <p>Wissensbasis der swissfuture-Fachgruppe Futures of Education. Klicke auf eine Seite um Inhalt zu sehen.</p>
            </div>
        </header>

        <div class="error-banner" id="app-error"></div>

        <div class="stats">
            <div class="stat-card"><div class="number" id="total-pages">–</div><div class="label">Seiten</div></div>
            <div class="stat-card"><div class="number" id="total-sources">–</div><div class="label">Quellen</div></div>
            <div class="stat-card"><div class="number" id="total-concepts">–</div><div class="label">Konzepte</div></div>
            <div class="stat-card"><div class="number" id="total-theses">–</div><div class="label">Thesen</div></div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="search" placeholder="Seite suchen...">
            </div>
            <div class="filter-buttons" id="filter-buttons"></div>
        </div>

        <div id="sections"></div>

        <footer><p id="footer-text">FoE-Wiki wird geladen …</p></footer>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div><h2 id="modal-title">Laden...</h2><div class="modal-meta" id="modal-meta"></div></div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // ---- Konfiguration ----
        const TYPE_ORDER = ['theses', 'concepts', 'sources', 'people'];
        const PLURAL = { theses: 'Thesen', concepts: 'Konzepte', sources: 'Quellen', people: 'Personen' };
        const SINGULAR = { theses: 'These', concepts: 'Konzept', sources: 'Quelle', people: 'Person' };
        const BADGE_TYPE = { theses: 'badge-thesis', concepts: 'badge-concept', sources: 'badge-source', people: 'badge-person' };
        const SECTION_HEADER_MAP = { 'Thesen': 'theses', 'Konzepte': 'concepts', 'Quellen': 'sources', 'Personen': 'people' };

        let pages = [];
        let slugMap = {};

        // ---- index.md laden und parsen ----
        async function init() {
            try {
                const res = await fetch('index.md');
                if (!res.ok) throw new Error('index.md nicht erreichbar (Status ' + res.status + ')');
                const text = await res.text();
                pages = parseIndex(text);
                buildSlugMap();
                render();
            } catch (err) {
                showError('Fehler beim Laden von index.md: ' + err.message + '. Läuft die Seite über einen HTTP-Server (nicht per Doppelklick geöffnet)?');
            }
        }

        function parseIndex(text) {
            const lines = text.split('\n');
            const lineRe = /^-\s*\[(.*?)\]\((.*?)\)\s*[—-]\s*(.*?)\s*\|\s*\*(intern|extern)\*\s*$/;
            let currentType = null;
            const result = [];
            for (const raw of lines) {
                const line = raw.trim();
                const headerMatch = line.match(/^##\s+(Thesen|Konzepte|Quellen|Personen)/);
                if (headerMatch) { currentType = SECTION_HEADER_MAP[headerMatch[1]]; continue; }
                if (/^##\s+Legende/.test(line)) { currentType = null; continue; }
                if (!currentType) continue;
                const m = line.match(lineRe);
                if (m) {
                    const [, title, path, summary, visibility] = m;
                    const slug = path.trim().split('/').pop().replace(/\.md$/, '');
                    result.push({
                        title: title.trim(), path: path.trim(), summary: summary.trim(),
                        visibility, type: currentType, slug
                    });
                }
            }
            return result;
        }

        function buildSlugMap() {
            slugMap = {};
            pages.forEach(p => { slugMap[p.slug.toLowerCase()] = p; });
        }

        // ---- Rendering ----
        function render() {
            document.getElementById('total-pages').textContent = pages.length;
            document.getElementById('total-sources').textContent = pages.filter(p => p.type === 'sources').length;
            document.getElementById('total-concepts').textContent = pages.filter(p => p.type === 'concepts').length;
            document.getElementById('total-theses').textContent = pages.filter(p => p.type === 'theses').length;
            document.getElementById('footer-text').textContent = 'FoE-Wiki • ' + new Date().toISOString().slice(0, 10) + ' • ' + pages.length + ' Seiten insgesamt';

            const filterBar = document.getElementById('filter-buttons');
            filterBar.innerHTML = '';
            const allBtn = makeFilterButton('all', 'Alle', true);
            filterBar.appendChild(allBtn);
            TYPE_ORDER.forEach(type => filterBar.appendChild(makeFilterButton(type, PLURAL[type], false)));

            const sectionsEl = document.getElementById('sections');
            sectionsEl.innerHTML = '';
            TYPE_ORDER.forEach(type => sectionsEl.appendChild(renderSection(type)));

            wireControls();
        }

        function makeFilterButton(filter, label, active) {
            const btn = document.createElement('button');
            btn.className = 'filter-btn' + (active ? ' active' : '');
            btn.dataset.filter = filter;
            btn.textContent = label;
            return btn;
        }

        function renderSection(type) {
            const items = pages.filter(p => p.type === type);
            const section = document.createElement('div');
            section.className = 'section';
            section.dataset.section = type;

            const h2 = document.createElement('h2');
            h2.textContent = PLURAL[type];
            section.appendChild(h2);

            const pagesDiv = document.createElement('div');
            pagesDiv.className = 'pages';

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'Noch keine ' + PLURAL[type] + ' angelegt.';
                pagesDiv.appendChild(empty);
            } else {
                items.forEach(p => pagesDiv.appendChild(renderPageItem(p)));
            }

            section.appendChild(pagesDiv);
            return section;
        }

        function renderPageItem(p) {
            const item = document.createElement('div');
            item.className = 'page-item';
            item.dataset.type = p.type;
            item.dataset.search = (p.title + ' ' + p.summary).toLowerCase();
            item.addEventListener('click', () => openPage(p.path));

            const titleDiv = document.createElement('div');
            titleDiv.className = 'page-title';
            titleDiv.textContent = p.title;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'page-meta';
            metaDiv.innerHTML =
                '<span class="badge ' + BADGE_TYPE[p.type] + '">' + SINGULAR[p.type] + '</span>' +
                '<span class="badge badge-' + p.visibility + '">' + (p.visibility === 'extern' ? 'Extern' : 'Intern') + '</span>';

            item.appendChild(titleDiv);
            item.appendChild(metaDiv);
            return item;
        }

        // ---- Modal / einzelne Seite laden ----
        async function openPage(path) {
            const modal = document.getElementById('modal');
            const titleEl = document.getElementById('modal-title');
            const metaEl = document.getElementById('modal-meta');
            const bodyEl = document.getElementById('modal-body');

            titleEl.textContent = 'Laden...';
            metaEl.innerHTML = '';
            bodyEl.innerHTML = '';
            modal.classList.add('active');

            try {
                const res = await fetch(path);
                if (!res.ok) throw new Error('Datei nicht erreichbar (Status ' + res.status + '): ' + path);
                const raw = await res.text();
                const { frontmatter, body } = parseFrontmatter(raw);
                const type = guessTypeFromPath(path);

                titleEl.textContent = frontmatter.title || path;
                metaEl.innerHTML =
                    '<span class="badge ' + (BADGE_TYPE[type] || '') + '">' + (SINGULAR[type] || '') + '</span>' +
                    '<span class="badge badge-' + (frontmatter.visibility || 'intern') + '">' + (frontmatter.visibility === 'extern' ? 'Extern' : 'Intern') + '</span>' +
                    '<span>' + (frontmatter.updated || frontmatter.created || '') + '</span>';

                let html = marked.parse(body);
                html = resolveWikilinks(html);
                bodyEl.innerHTML = html;

                bodyEl.querySelectorAll('a.wikilink').forEach(a => {
                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        openPage(a.dataset.path);
                    });
                });
            } catch (err) {
                titleEl.textContent = 'Fehler beim Laden';
                bodyEl.innerHTML = '<p>' + escapeHtml(err.message) + '</p>';
            }
        }

        function parseFrontmatter(raw) {
            const m = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
            if (!m) return { frontmatter: {}, body: raw };
            const frontmatter = {};
            m[1].split('\n').forEach(line => {
                const idx = line.indexOf(':');
                if (idx === -1) return;
                const key = line.slice(0, idx).trim();
                let value = line.slice(idx + 1).trim();
                if (value.startsWith('[') && value.endsWith(']')) {
                    value = value.slice(1, -1).split(',').map(s => s.trim()).filter(Boolean);
                }
                frontmatter[key] = value;
            });
            return { frontmatter, body: m[2] };
        }

        function resolveWikilinks(html) {
            return html.replace(/\[\[([^\]]+)\]\]/g, (match, slug) => {
                const key = slug.trim().toLowerCase();
                const target = slugMap[key];
                if (target) {
                    return '<a href="#" class="wikilink" data-path="' + target.path + '">' + escapeHtml(target.title) + '</a>';
                }
                return '<span class="wikilink-broken" title="Seite nicht gefunden: ' + escapeHtml(slug) + '">' + escapeHtml(slug) + '</span>';
            });
        }

        function guessTypeFromPath(path) {
            for (const type of TYPE_ORDER) {
                if (path.indexOf('wiki/' + type + '/') !== -1) return type;
            }
            return '';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function showError(msg) {
            const el = document.getElementById('app-error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ---- Suche / Filter ----
        function wireControls() {
            const searchInput = document.getElementById('search');
            const filterBtns = document.querySelectorAll('.filter-btn');
            let activeFilter = 'all';

            function updateDisplay() {
                const searchTerm = searchInput.value.toLowerCase();
                document.querySelectorAll('.page-item').forEach(item => {
                    const matchesSearch = searchTerm === '' || (item.dataset.search || '').includes(searchTerm);
                    const matchesFilter = activeFilter === 'all' || activeFilter === item.dataset.type;
                    item.classList.toggle('hidden', !(matchesSearch && matchesFilter));
                });
                document.querySelectorAll('.section').forEach(section => {
                    const visible = section.querySelectorAll('.page-item:not(.hidden)').length;
                    const hasEmptyState = section.querySelector('.empty');
                    section.style.opacity = (visible === 0 && !hasEmptyState) ? '0.5' : '1';
                });
            }

            searchInput.addEventListener('input', updateDisplay);
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeFilter = btn.dataset.filter;
                    updateDisplay();
                });
            });
        }

        document.getElementById('modal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeModal();
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
